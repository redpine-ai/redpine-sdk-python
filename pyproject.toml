[project]
name = "redpine-sdk"
version = "0.1.5"
description = "Python client for the Redpine search API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["redpine", "search", "retrieval", "scientific-literature", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "attrs>=23.1",
  "python-dateutil>=2.8",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://redpine.ai"
Documentation = "https://docs.redpine.ai/docs/sdks"
Repository = "https://github.com/redpine-ai/redpine-sdk-python"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "openapi-python-client>=0.21",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redpine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/redpine/_generated"]
